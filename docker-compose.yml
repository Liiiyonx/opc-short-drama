# 生产编排：nginx(web) + api + worker + mysql + redis + minio
# 用法：
#   cp .env.example .env  # 填 LLM_API_KEY 等
#   bash deploy.sh        # 或手动 docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: opc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: opcroot
      MYSQL_DATABASE: opc
      MYSQL_USER: opc
      MYSQL_PASSWORD: opc
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: opc-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: opc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opcadmin
      MINIO_ROOT_PASSWORD: opcadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    container_name: opc-api
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql+aiomysql://opc:opc@mysql:3306/opc?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: opcadmin
      MINIO_SECRET_KEY: opcadmin123
      MINIO_BUCKET: opc
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: opc-worker
    command: python -m arq app.workers.tasks.WorkerSettings
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql+aiomysql://opc:opc@mysql:3306/opc?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: opcadmin
      MINIO_SECRET_KEY: opcadmin123
      MINIO_BUCKET: opc
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: opc-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
