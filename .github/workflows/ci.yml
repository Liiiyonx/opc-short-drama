name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 安装 ffmpeg（成片合成与时长探测）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 全量测试（LLM/TTS 走显式 mock）
        run: python -m pytest tests/ -q
        env:
          LLM_PROVIDER: mock
          TTS_PROVIDER: mock

  frontend:
    name: 前端构建（vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  security:
    name: 依赖漏洞扫描（pip-audit + npm audit）
    runs-on: ubuntu-latest
    continue-on-error: true  # 扫描结果先公示不阻塞合并；出红线 CVE 时改为阻塞
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit（后端依赖 CVE）
        run: |
          pip install pip-audit
          pip install -r backend/requirements.txt
          pip-audit --desc --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: npm audit（前端依赖，仅 high/critical）
        run: npm audit --prefix frontend --audit-level=high || true
